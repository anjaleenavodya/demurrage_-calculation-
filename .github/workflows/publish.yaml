name: Build and Push Docker Image

on:
  push:
    paths:
      - 'Intern/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: './Intern/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./Intern/requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=. pytest Intern/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_INTERN_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./Intern
          file: ./Intern/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: janthalgahawaththa/demurrage-calculation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
